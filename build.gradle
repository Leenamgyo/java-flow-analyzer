plugins {
    id 'java'
    id 'application'
}

group = 'analyzer'
version = '0.1.0'

repositories {
    // 사내 승인 저장소가 있다면 여기에 교체/추가한다. (로컬 캐시 우선 사용)
    mavenCentral()
}

dependencies {
    implementation 'com.github.javaparser:javaparser-symbol-solver-core:3.26.4'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.21.4'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.21.4'

    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.junit.jupiter:junit-jupiter-params'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    // 설치된 JDK 버전과 무관하게 Java 21 바이트코드/API로 컴파일한다.
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

application {
    mainClass = 'analyzer.Main'
}

tasks.named('run') {
    workingDir = projectDir
}

// 전체 클래스 흐름도 (Action 분석과 따로): ./gradlew runClass --args="--config … --class ContentUtil"
// 카탈로그 질의 (분석 없이 catalog/ 만 읽음): ./gradlew query --args="who-uses ContentUtil.getInfo"
tasks.register('query', JavaExec) {
    group = 'application'
    description = '카탈로그 질의: who-uses · uses · common · shared · unused · usage · coverage'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'analyzer.query.QueryMain'
    workingDir = projectDir
}

tasks.register('runClass', JavaExec) {
    group = 'application'
    description = '클래스의 메서드 전부를 한 번에 분석해 output/class/<클래스>/flowchart.html'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'analyzer.classflow.ClassFlowMain'
    workingDir = projectDir
}

tasks.named('test') {
    useJUnitPlatform()
    workingDir = projectDir
    testLogging {
        events 'failed'
        exceptionFormat 'full'
    }
}
