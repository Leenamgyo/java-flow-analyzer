# 프로젝트 설정 (샘플 프로젝트). 기본 조건은 내장 src/main/resources/analyzer-defaults.yml —
# 여기에는 바꿀 키만 쓴다. 맵은 키 단위로 합쳐지고 목록·값은 교체된다. CLI 옵션이 가장 우선.
#   ./gradlew run                                     # 이 파일의 class 분석
#   ./gradlew run --args="--class CaseAction --method throwCases"
target:
  source-root: src/test/resources/sample-project/src/main/java   # 읽기 전용 접근
  # 멀티 모듈이면 source-roots 로 여러 루트 (같은 FQN 이 두 루트에 있으면 AMBIGUOUS)
  # source-roots:
  #   - /path/to/project/actions/src/main/java
  #   - /path/to/project/lib/src/main/java
  class: ScpAppListAction            # 단순명 또는 FQN (후보가 여러 개면 FQN 필요). CLI --class 로 바꿔 실행
  entry-method: execute              # 비우면 매핑 어노테이션 → execute() 추론
  # 오버로딩된 진입 메서드일 때만 지정 (단순 타입명)
  # entry-method-parameter-types: [HttpServletRequest, HttpServletResponse]

analysis:
  expand-roles: [Service, Biz, DAO, Repository, Mapper]   # 기본값(+Validator) 대신 이 목록 사용

# 사용자 정의 Request 유틸리티 (HttpServletRequest.getParameter/Values/Map 은 기본 내장)
request-parameter-rules:
  - class: RequestUtil
    methods:
      - { name: getString, name-arg-index: 1, default-arg-index: 2, type: String }
  - class: ParameterUtil
    methods:
      - { name: getInt, name-arg-index: 1, default-arg-index: 2, type: int }

output:
  # 호출 트리에서 뺄 호출 (* 와일드카드, 대상 "클래스.메서드" 단순명·FQN 또는 원문 "수신객체.메서드")
  call-tree-exclude:
    - "String.*"        # java.lang.String 메서드 (equals, trim …)
    - "StringUtil.*"
    - "Integer.*"       # java.lang.Integer (parseInt, valueOf …)
    - "LOG.*"           # 로거 필드 LOG 의 호출 (info, debug …)
