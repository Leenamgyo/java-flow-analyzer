# 예제 프로젝트 설정 — 분석 대상은 이 저장소 옆 디렉터리 ../java-flow-example (멀티 모듈, 읽기 전용)
#   Projects/
#     java-flow-analyzer/   ← 분석기 (여기서 실행, 결과는 output/<클래스>/)
#     java-flow-example/    ← 분석 대상: action/(Struts Action) + lib/(VO·Service·Biz·DAO·Mapper·Util·common)
#
#   ./gradlew run --args="--config config/java-flow-example.yml"                          # OrderRegisterAction
#   ./gradlew run --args="--config config/java-flow-example.yml --class OrderListAction"  # Action 만 바꿔 실행
# 기본 조건(analyzer-defaults.yml)과 다른 것만 쓴다. 상대 경로는 이 저장소 루트 기준.
target:
  source-roots:
    - ../java-flow-example/action/src/main/java
    - ../java-flow-example/lib/src/main/java
  class: OrderRegisterAction

request-parameter-rules:
  - class: ParamUtil
    methods:
      - { name: getInt,    name-arg-index: 1, default-arg-index: 2, type: int }
      - { name: getString, name-arg-index: 1, default-arg-index: 2, type: String }
      - { name: getLong,   name-arg-index: 1, default-arg-index: 2, type: long }
      - { name: getBoolean, name-arg-index: 1, default-arg-index: 2, type: boolean }
      - { name: getDate,   name-arg-index: 1, default-arg-index: 2, type: String }
