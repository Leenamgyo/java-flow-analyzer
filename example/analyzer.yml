# example: legacy-shop 프로젝트 설정 — 기본 조건(analyzer-defaults.yml)과 다른 것만 쓴다.
#   ./gradlew run --args="--config example/analyzer.yml"                          # OrderRegisterAction
#   ./gradlew run --args="--config example/analyzer.yml --class OrderListAction"  # Action 만 바꿔 실행
target:
  # 멀티 모듈: action(Action) + lib(Service·Biz·DAO·Mapper·VO·Util·common)
  source-roots:
    - example/legacy-shop/action/src/main/java
    - example/legacy-shop/lib/src/main/java
  class: OrderRegisterAction

request-parameter-rules:
  - class: ParamUtil
    methods:
      - { name: getInt,    name-arg-index: 1, default-arg-index: 2, type: int }
      - { name: getString, name-arg-index: 1, default-arg-index: 2, type: String }
      - { name: getLong,   name-arg-index: 1, default-arg-index: 2, type: long }
      - { name: getBoolean, name-arg-index: 1, default-arg-index: 2, type: boolean }
      - { name: getDate,   name-arg-index: 1, default-arg-index: 2, type: String }

output:
  directory: example/output
