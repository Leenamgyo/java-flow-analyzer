# 기본 분석 조건 (내장). 프로젝트 설정 파일(--config)은 바꿀 키만 쓰면 이 값 위에 덮어쓴다.
#   - 맵(analysis, phases, output …)은 키 단위로 합쳐지고, 목록·값은 통째로 교체된다.
#   - 우선순위: 이 파일 < 프로젝트 설정 파일 < CLI 옵션(--source-root, --class, --method, --output)
target:
  # entry-method 를 비우면 매핑 어노테이션(@RequestMapping 등) → public execute() 순으로 찾는다
  entry-method:

analysis:
  max-depth: 1
  expand-same-class-methods: true
  include-conditions: true
  include-exceptions: true
  include-request-parameters: true
  include-external-library-calls: false
  # max-depth 를 넘어도 본문을 분석할 역할 (Util 등은 제외 → depth-limit)
  expand-roles: [Service, Biz, DAO, Repository, Mapper, Validator]
  # 인터페이스 호출: source-root 내 구현 클래스가 정확히 1개면 구현 후보로 연결 (런타임 DI 확정 아님)
  link-single-implementation: true
  # VO/DTO/Command/Map 바인딩 수집 + 값 출처·변환·조건 추적
  include-bindings: true
  # 선언 뒤 값이 바뀌는 지역 변수·파라미터(total -= usePoint, size = MAX …) 변경 이력 수집
  include-variable-changes: true
  # 상속(extends) 정보 포함: 상위 클래스 필드(필드 커버리지)·extends 목록·상위 클래스 역할 근거(SUPERTYPE)
  #   false = 빼기 (상위 클래스로만 역할이 정해지는 클래스는 근거 유지). 상속 필드 바인딩·상위 메서드 호출은 그대로 기록
  include-inheritance: false
  classpath-jars: []

# 프로젝트 고유 요청 읽기 메서드 = 바인딩 (HttpServletRequest.getParameter/Values/Map 은 기본 내장) — 프로젝트별로 지정
#   - class: ParamUtil                       # 생략하면 클래스 무관(메서드 이름만)
#     methods:
#       - { name: getString, name-arg-index: 1, default-arg-index: 2, type: String }
#       - { name: getSystemId }                # 이름 인자 없음 → 메서드명에서 systemId
#       - { name: getAbi, parameter: abiType } # 이름 고정
#       - { name: defVal, wraps: 0, default-arg-index: 1 }  # 기본값 래퍼: defVal(getParam(req,"x"), "0")
request-parameter-rules: []

# 단계 보기 (phase-flowchart.mmd · phase-summary.md): 바인딩 › 체크 › 로직 › 후처리
phases:
  enabled: true
  logic-roles: [Service, Biz, DAO, Repository, Mapper]
  check-roles: [Validator]
  check-method-names: ["validate*", "check*"]

output:
  directory: output     # 결과는 <directory>/<클래스명>/
  yaml: true
  tree: true
  tree-include-control-blocks: true
  mermaid: true
  direction: TD
  # Mermaid 레이아웃: dagre = Mermaid 기본 / elk = 직각 간선 (뷰어가 ELK 를 지원할 때)
  layout: dagre
  # 흐름도 색: light(흰 바탕, SVG 도 흰 바탕) | dark(어두운 바탕·밝은 글자, Mermaid dark 테마)
  color-theme: light
  # 흐름도를 flowchart-svg/ 에 SVG 로도 (Mermaid CLI 필요: npm install -g @mermaid-js/mermaid-cli, 없으면 경고 후 생략)
  #   큰 흐름도도 그리도록 글자 수·간선 수 한계를 올려서 렌더링한다
  flowchart-svg: true
  # mmdc 경로 (비우면 PATH 의 mmdc)
  mermaid-cli: ""
  # 노드 한 줄 최대 길이 — 넘으면 쉼표·연산자·메서드 체인 앞에서 끊고 이어지는 줄은 "> " 로 시작 (0 = 끊지 않음)
  max-line-length: 150
  # 메서드별 보기 (flowchart.mmd = 전체 한 장은 따로 항상): flowchart-sections/ = 메서드를 구간(section-size 줄 남짓)으로 나눈 상세,
  #   flowchart-skeleton/ = 00-overview(메서드 호출 관계) + 메서드마다 골격 1장(분기·return/throw·catch·세부 호출만,
  #   사이 코드는 "⋯ 코드 n줄 · 상세 구간 k"). 합본 flowchart-sections.md · flowchart-skeleton.md.
  #   SVG(flowchart-svg/sections·skeleton)는 노드를 클릭하면 이동: 골격 ⋯ → 상세 구간, ▶/◀ → 다음·이전 구간·다른 메서드, ⌂ → 골격·전체 구조
  flowchart-sections: true
  section-size: 60
  # 흐름도에서 뺄 호출·메서드 (사용자 관리, 기본 없음 = 분석한 코드를 빠짐없이 그림). * 와일드카드
  #   호출 대상 "클래스.메서드"(단순명·FQN) 또는 호출 원문 "수신객체.메서드" 와 비교 — 맞는 메서드는 본문 상자도 생략
  #   예: ["*Util.*", "LOG.debug", "com.example.common.AuditHelper.*"]
  flowchart-exclude: []
  # 호출 트리(call-tree.txt)에서 뺄 호출 — flowchart-exclude 와 같은 패턴. 맞는 호출은 줄도, 그 아래 전개도 없다
  #   예: ["String.*", "StringUtil.*"]
  call-tree-exclude: []
