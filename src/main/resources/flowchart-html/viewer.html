<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
  :root {
    --bg: #ffffff; --fg: #0f172a; --muted: #64748b; --line: #e2e8f0; --panel: #f8fafc;
    --edge: #475569; --exc: #b91c1c; --hit: #f59e0b; --sel: #2563eb;
    --g-method: #f8fafc; --g-method-stroke: #94a3b8; --g-block: #ffffff; --g-block-stroke: #cbd5e1;
    --g-loop-stroke: #2563eb; --g-try-stroke: #b91c1c; --g-title: #334155; --label-bg: #ffffff;
  }
  :root[data-theme="dark"] {
    --bg: #0f172a; --fg: #e2e8f0; --muted: #94a3b8; --line: #334155; --panel: #111827;
    --edge: #94a3b8; --exc: #f87171; --hit: #fbbf24; --sel: #60a5fa;
    --g-method: #111827; --g-method-stroke: #475569; --g-block: #0f172a; --g-block-stroke: #334155;
    --g-loop-stroke: #60a5fa; --g-try-stroke: #f87171; --g-title: #cbd5e1; --label-bg: #0f172a;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 13px/1.4 -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; overflow: hidden; }
  #bar { position: fixed; top: 0; left: 0; right: 0; height: 44px; display: flex; gap: 6px; align-items: center;
    padding: 0 10px; border-bottom: 1px solid var(--line); background: var(--panel); z-index: 2; box-sizing: border-box; }
  #bar .title { font-weight: 600; margin-right: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 32vw; }
  #bar input { width: 220px; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); }
  #bar button { padding: 5px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); cursor: pointer; white-space: nowrap; }
  #bar button:hover { border-color: var(--sel); }
  #bar .info { color: var(--muted); margin-left: auto; white-space: nowrap; }
  #stage { position: fixed; top: 44px; left: 0; right: 0; bottom: 0; cursor: grab; }
  #stage.drag { cursor: grabbing; }
  svg#canvas { width: 100%; height: 100%; display: block; user-select: none; }
  #panel { position: fixed; top: 54px; right: 10px; width: min(560px, 46vw); max-height: calc(100% - 70px); overflow: auto;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: none; z-index: 3;
    box-shadow: 0 4px 18px rgba(0,0,0,.12); }
  #panel pre { margin: 6px 0; padding: 8px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
    white-space: pre-wrap; word-break: break-all; font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, "D2Coding", monospace; }
  #panel .meta { color: var(--muted); font-size: 12px; }
  #panel .row { display: flex; gap: 6px; align-items: center; justify-content: space-between; }
  #panel button { padding: 3px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); cursor: pointer; }
  #busy { position: fixed; inset: 44px 0 0 0; display: flex; align-items: center; justify-content: center; color: var(--muted);
    background: color-mix(in srgb, var(--bg) 70%, transparent); z-index: 4; font-size: 15px; }
  #help { color: var(--muted); font-size: 12px; position: fixed; left: 10px; bottom: 8px; z-index: 2; pointer-events: none; }
  .node { cursor: pointer; }
  .node.hit > .shape { stroke: var(--hit) !important; stroke-width: 4px !important; }
  .node.sel > .shape { stroke: var(--sel) !important; stroke-width: 4px !important; }
  .gtitle { cursor: pointer; }
  .gtitle:hover text { text-decoration: underline; }
  text { white-space: pre; }
</style>
</head>
<body>
<div id="bar">
  <span class="title" id="ttl"></span>
  <input id="q" type="search" placeholder="코드·변수·메서드 검색 (Enter: 다음)">
  <button id="prev" title="이전 결과">▲</button><button id="next" title="다음 결과">▼</button>
  <button id="fit" title="전체가 보이게">화면 맞춤</button>
  <button id="collapseAll" title="진입 메서드 말고 모든 메서드 상자를 접기">메서드 접기</button>
  <button id="expandAll" title="모든 상자 펴기">모두 펴기</button>
  <span class="info" id="info"></span>
</div>
<div id="stage"><svg id="canvas" xmlns="http://www.w3.org/2000/svg"><defs id="defs"></defs><g id="vp"></g></svg></div>
<div id="panel"></div>
<div id="busy">배치 계산 중…</div>
<div id="help">휠: 확대/축소 · 끌기: 이동 · 상자 제목 클릭: 접기/펴기 · 노드 클릭: 상세 · 노란 상자 더블클릭: 세부 메서드로 이동</div>
<script>/*__ELK__*/</script>
<script>const FLOW = "__DATA__";</script>
<script>/*__VIEWER__*/</script>
</body>
</html>
